version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eve_healthcare_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://eve_user:eve_password@db:5432/eve_healthcare
      - SECRET_KEY=eve-production-secret-key-super-secure-token-2026
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: eve_healthcare_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=eve_user
      - POSTGRES_PASSWORD=eve_password
      - POSTGRES_DB=eve_healthcare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_healthcare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
